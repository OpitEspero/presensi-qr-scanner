<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Scanner QR Presensi Siswa</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#0f172a;color:#e2e8f0;font-family:Arial,sans-serif;padding:20px;display:flex;justify-content:center;align-items:center}
    .wrap{width:min(100%,680px)}
    .card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:22px;box-shadow:0 20px 50px #0005}
    h1{font-size:22px;margin:0;color:#67e8f9}
    .sub{font-size:13px;color:#94a3b8;line-height:1.6}
    .mode{display:inline-block;background:#0e7490;color:white;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:bold;margin:10px 0 16px}
    #reader{width:100%;min-height:280px;border:1px solid #475569;border-radius:14px;overflow:hidden;background:#020617}
    #reader video{object-fit:cover}
    .status{margin-top:14px;padding:12px;border-radius:10px;background:#0f172a;color:#cbd5e1;font-size:13px;line-height:1.5;overflow-wrap:anywhere;text-align:center}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .primary{background:#0891b2;color:white}
    .secondary{background:#334155;color:#e2e8f0}
    .danger{background:#be123c;color:white}
    .nisn{font-family:monospace;color:#6ee7b7;font-size:22px;font-weight:bold;margin-top:4px}
    .hint{font-size:12px;color:#94a3b8;margin-top:14px}
    .badge-success{background:#065f46;color:#34d399;padding:6px 12px;border-radius:8px;font-weight:bold;display:inline-block;margin-bottom:6px}
    .badge-error{background:#881337;color:#fecdd3;padding:6px 12px;border-radius:8px;font-weight:bold;display:inline-block;margin-bottom:6px}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>SCANNER QR PRESENSI SISWA</h1>
      <p class="sub">Arahkan QR Code siswa ke kamera. Kamera akan otomatis memproses dan siap memindai siswa berikutnya.</p>
      <div class="mode" id="modeLabel">MODE DATANG</div>
      <div id="reader"></div>
      <div class="status" id="status">Tekan <b>Aktifkan Kamera</b> untuk memulai presensi massal.</div>
      <div class="actions">
        <button class="primary" id="startBtn" onclick="startCamera()">📷 Aktifkan Kamera</button>
        <button class="secondary" id="switchBtn" onclick="switchCamera()" disabled>🔄 Ganti Kamera</button>
        <button class="danger" id="stopBtn" onclick="stopCamera()" disabled>⛔ Matikan Kamera</button>
      </div>
      <p class="hint">Kamera akan otomatis tetap terbuka tanpa perlu menekan tombol berulang kali.</p>
    </section>
  </main>

<script>
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ASLI ANDA (AKHIRAN /exec)
  const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzxI28t37AtmAyhkICO3ZF_iBM4tFCKEn7kANBV7ZQhFRY5NvW4qVKhng_TdjTHLQSXhg/exec"; 

  const params = new URLSearchParams(location.search);
  const mode = params.get('mode') === 'out' ? 'out' : 'in';
  const channel = params.get('channel') || '';
  document.getElementById('modeLabel').textContent = mode === 'out' ? 'MODE PULANG' : 'MODE DATANG';

  let scanner = null;
  let cameras = [];
  let cameraIndex = 0;
  let busy = false;
  let started = false;

  function setStatusHtml(htmlContent, isError) {
    const el = document.getElementById('status');
    el.innerHTML = htmlContent;
    el.style.border = isError ? '1px solid #e11d48' : '1px solid #0891b2';
  }

  function playSound(type = 'success') {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      if (type === 'success') {
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      } else {
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      }
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  async function startCamera() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatusHtml('<span class="badge-error">Akses Ditolak</span><br>Gunakan koneksi HTTPS resmi.', true);
      return;
    }
    document.getElementById('startBtn').disabled = true;
    setStatusHtml('Meminta izin kamera...');
    
    try {
      cameras = await Html5Qrcode.getCameras();
      if (!cameras || !cameras.length) throw new Error('Tidak ada kamera terdeteksi.');
      
      cameraIndex = chooseBackCamera(cameras);
      if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false });

      await scanner.start(
        { deviceId: { exact: cameras[cameraIndex].id } },
        { 
          fps: 10, 
          qrbox: function(viewWidth, viewHeight) {
            const size = Math.floor(Math.min(viewWidth, viewHeight) * 0.72);
            return { width: Math.max(180, Math.min(size, 320)), height: Math.max(180, Math.min(size, 320)) };
          }, 
          aspectRatio: 1.0 
        },
        onQrDecoded,
        function() {}
      );

      started = true;
      document.getElementById('switchBtn').disabled = cameras.length < 2;
      document.getElementById('stopBtn').disabled = false;
      setStatusHtml('<b>Kamera Standby</b><br>Arahkan QR Code siswa ke kotak kamera.');
    } catch (err) {
      document.getElementById('startBtn').disabled = false;
      setStatusHtml('<b>Gagal Membuka Kamera:</b> ' + (err.message || err), true);
    }
  }

  function chooseBackCamera(list) {
    const idx = list.findIndex(c => /back|rear|environment|belakang/i.test(c.label || ''));
    return idx >= 0 ? idx : 0;
  }

  async function switchCamera() {
    if (!cameras.length) return;
    if (started) await stopCamera();
    cameraIndex = (cameraIndex + 1) % cameras.length;
    await startCamera();
  }

  async function stopCamera() {
    if (scanner && started) {
      try { await scanner.stop(); } catch (e) {}
      try { scanner.clear(); } catch (e) {}
    }
    started = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('switchBtn').disabled = true;
    setStatusHtml('Kamera dimatikan.');
  }

  async function onQrDecoded(decodedText) {
    if (busy) return;
    const nisn = String(decodedText || '').trim();
    if (!nisn) return;

    busy = true;
    try { if (scanner && started) await scanner.pause(true); } catch (e) {}
    
    setStatusHtml('⏳ Memproses NISN: <span class="nisn">' + nisn + '</span>...');

    const payload = { type: 'PRESENSI_QR_RESULT', status: 'success', channel: channel, nisn: nisn, mode: mode };
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(payload, '*');
    }

    fetch(GAS_WEBAPP_URL, {
      method: 'POST',
      mode: 'cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'scan', nisn: nisn, mode: mode })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        playSound('success');
        setStatusHtml(`
          <div class="badge-success">✔ PRESENSI BERHASIL</div>
          <div style="font-size:16px; font-weight:bold; color:white;">${data.student.name} (${data.student.class_name})</div>
          <div class="nisn">${nisn}</div>
          <div style="font-size:11px; color:#94a3b8; margin-top:4px;">Jam: ${data.time} | Status: ${data.type}</div>
        `, false);
      } else {
        playSound('error');
        setStatusHtml(`
          <div class="badge-error">✖ PRESENSI GAGAL</div>
          <div style="color:#fecdd3; font-weight:bold;">${data.message}</div>
          <div class="nisn">${nisn}</div>
        `, true);
      }
    })
    .catch(err => {
      playSound('error');
      setStatusHtml(`
        <div class="badge-error">⚠️ KESALAHAN KONEKSI</div>
        <div>Gagal terhubung ke Google Sheets server. Periksa URL Web App Apps Script Anda.</div>
        <div class="nisn">${nisn}</div>
      `, true);
    })
    .finally(() => {
      setTimeout(async () => {
        setStatusHtml('<b>Kamera Standby</b><br>Silakan scan siswa berikutnya...');
        busy = false;
        try { if (scanner && started) await scanner.resume(); } catch (e) {}
      }, 2000);
    });
  }

  window.addEventListener('beforeunload', function() {
    try { if (scanner && started) scanner.stop(); } catch (e) {}
  });
</script>
</body>
</html>
